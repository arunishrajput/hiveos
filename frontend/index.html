<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>HiveOS — an office of AI agents</title>
    <meta
      name="description"
      content="Hire a floor of AI agents your whole team can watch work in real time — on one shared token budget, behind a ceiling the server actually enforces."
    />
    <!-- Declared so the browser paints the canvas cream before React mounts.
         Without it a cold load flashes the UA's default white — or, on a
         device set to dark, near-black — behind a page that is neither.

         These are Paper Office's values, and they stay literal: the browser
         needs them before a stylesheet is parsed or a module is fetched. A
         world that is not Paper Office overrides `color-scheme` from its own
         `:root[data-world=…]` block, and the provider updates `theme-color`
         from the registry once React is up. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff8e7" />

    <!-- Stamp the stored world before first paint.
         Without this a returning visitor who chose a dark world gets a flash
         of the cream office before React mounts and corrects it — the worst
         frame of the whole load, and the one a recording would catch.
         Deliberately does no validation: an unrecognised id matches no
         `:root[data-world=…]` block, so the board simply renders as Paper
         Office, and the provider rewrites the attribute on mount.

         `data-world` alone does not finish the job, which Phase 19 found when
         the first dark world landed. The attribute means nothing until the
         stylesheet that reads it arrives, and until then the canvas is painted
         from the two literals above — so the flash moved rather than went
         away. `hiveos.world.paint` carries the `color-scheme` and
         `theme-color` of whatever world was last chosen, written by the
         provider in worlds.js, and replaying it here paints the right ground
         on the very first frame with no CSS and no modules loaded.

         Stored rather than derived because this script is inline and runs
         before any module: it cannot import the registry, and a hard-coded
         list of dark worlds here would be the same fact in two places. -->
    <script>
      try {
        var w = localStorage.getItem('hiveos.world')
        if (w) document.documentElement.dataset.world = w

        var paint = JSON.parse(localStorage.getItem('hiveos.world.paint') || 'null')
        if (paint && paint.scheme) {
          document.documentElement.style.colorScheme = paint.scheme
          var ms = document.querySelector('meta[name="color-scheme"]')
          if (ms) ms.setAttribute('content', paint.scheme)
          var mt = document.querySelector('meta[name="theme-color"]')
          if (mt && paint.themeColor) mt.setAttribute('content', paint.themeColor)
        }
      } catch (e) {
        /* Blocked or corrupt storage is not a reason to fail a page load —
           it costs one repaint once the stylesheet lands. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
